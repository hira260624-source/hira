<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1000" />
<title>히라 · HIRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet" />
<style>
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-4Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-7Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap;}
@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-9Black.woff2') format('woff2');font-weight:900;font-display:swap;}
  :root{
    --red:#ff8c2a;--red-d:#ea6e0e;--pink:#ffd7ad;--pink-l:#ffedd9;--hot:#ff5c9e;
    --ink:#46342a;--paper:#fffaf1;--frame:#ffd190;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scrollbar-gutter:stable;}
  body{font-family:'A2z',sans-serif;font-weight:800;color:var(--ink);
    background:var(--paper);
    background-image:radial-gradient(rgba(255,140,42,.10) 17%,transparent 18%);background-size:23px 23px;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 12px;}

  /* ===== 카드 스테이지 : 470x584 디자인 캔버스 → 통 스케일 ===== */
  .stage{position:relative;width:min(940px,96vw);aspect-ratio:940/1168;margin:0 auto;}
  .poster{position:absolute;top:0;left:0;width:470px;height:584px;transform-origin:top left;
    overflow:hidden;background:var(--frame);border-radius:14px;
    box-shadow:0 12px 30px rgba(70,45,25,.28);isolation:isolate;}
  /* 프레임 미세 질감 */
  .poster::before{content:'';position:absolute;inset:0;z-index:0;opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.55) 16%,transparent 17%);background-size:14px 14px;}

  /* ===== 배경 사진 카드 (z1) — 배경 = /bg.jpg 파일만 올리면 교체됨 ===== */
  .card{position:absolute;left:24px;right:24px;top:104px;bottom:28px;z-index:1;
    border-radius:24px;border:10px solid #fff;overflow:hidden;
    background-image:url('/bg.jpg'),linear-gradient(168deg,#ffe9d0 0%,#fff6ea 52%,#ffddba 100%);
    background-size:cover,cover;background-position:center,center;
    box-shadow:0 6px 0 rgba(234,110,14,.12),0 14px 30px rgba(70,45,25,.24);}
  .card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 30%);}

  /* ===== 아바타 (z2) — /avatar.png 올리면 교체 (세로형 PNG 권장), 없으면 키비주얼 ===== */
  .art{position:absolute;left:0;right:0;top:18px;bottom:0;z-index:2;
    display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
  .art img{height:100%;width:auto;max-width:none;
    filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 8px 14px rgba(70,45,25,.22));}

  /* ===== UI 레이어 (z3) ===== */
  /* 좌상단 프로필 칩 → 프로필 페이지 */
  .chip{position:absolute;left:18px;top:16px;z-index:3;display:flex;align-items:center;gap:9px;
    background:#fff;border-radius:24px;padding:7px 15px 7px 8px;text-decoration:none;color:var(--ink);
    box-shadow:0 4px 12px rgba(234,110,14,.2);transition:transform .15s ease;}
  .chip:hover{transform:translateY(-2px);}
  .chip img{width:37px;height:37px;border-radius:50%;object-fit:cover;object-position:center 30%;
    border:2.5px solid var(--pink);}
  .chip .nm{font-weight:900;font-size:.98rem;line-height:1.15;}
  .chip .nm i{font-style:normal;color:var(--red);font-size:.8rem;}
  .chip .sub{display:block;font-weight:700;font-size:.6rem;color:#a08573;letter-spacing:.01em;}

  /* 우상단 앱 버튼 2x2 — 일정 / 노래 / 업보 / 안내 */
  .apps{position:absolute;right:18px;top:14px;z-index:4;
    display:grid;grid-template-columns:repeat(2,47px);gap:8px;}
  .app{width:47px;height:47px;border-radius:15px;background:linear-gradient(180deg,#ffa651,var(--red));text-decoration:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 3px 0 var(--red-d),0 6px 12px rgba(234,110,14,.3);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .18s ease,box-shadow .22s ease;}
  .app svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
  .app b{font-family:'A2z',sans-serif;font-weight:800;font-size:.55rem;color:#fff;letter-spacing:.02em;}
  .app:hover{transform:translateY(-4px) scale(1.09) rotate(4deg);background:var(--hot);
    box-shadow:0 6px 0 #d63b7d,0 10px 16px rgba(255,92,158,.35);}
  .app:active{transform:translateY(-1px) scale(1.03);}
  .app:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}

  /* 좌측 레일 */
  .onair{position:absolute;left:36px;top:206px;z-index:3;width:128px;
    background:#fff;border-radius:15px;padding:10px 12px 11px;box-shadow:0 5px 14px rgba(234,110,14,.2);}
  .onair .t{font-size:.6rem;letter-spacing:.14em;color:#b08a6e;font-weight:800;}
  .onair .tm{font-size:1.06rem;font-weight:900;color:var(--red-d);margin-top:3px;}
  .onair .off{display:inline-block;margin-top:6px;background:var(--pink-l);color:var(--red-d);
    font-size:.62rem;font-weight:800;border-radius:11px;padding:2px 9px;}

  .tagset{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
  .tagset.l1{left:36px;top:316px;}
  .tagset.l2{left:36px;top:384px;}
  .tagset .k{background:var(--red);color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.05em;
    border-radius:13px;padding:3px 12px;box-shadow:0 3px 8px rgba(234,110,14,.28);}
  .tagset .v{background:#fff;color:var(--red-d);font-size:.78rem;font-weight:900;
    border-radius:13px;padding:3px 12px;box-shadow:0 3px 8px rgba(234,110,14,.2);}


  /* 우측 레일 */
  .tagset.r1{left:auto;right:32px;top:210px;align-items:flex-end;}
  .live{position:absolute;left:36px;top:468px;z-index:3;text-decoration:none;
    background:var(--hot);color:#fff;font-weight:800;font-size:.9rem;
    border:3px solid #fff;border-radius:20px;padding:8px 19px;
    box-shadow:0 4px 0 #d63b7d,0 8px 14px rgba(255,92,158,.32);transition:transform .15s ease;}
  .live:hover{transform:translateY(-3px);}
  .sns{position:absolute;right:32px;top:266px;z-index:3;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .sns a{background:#fff;color:var(--red-d);text-decoration:none;font-weight:800;font-size:.68rem;
    border-radius:13px;padding:3px 12px;box-shadow:0 3px 8px rgba(234,110,14,.22);transition:transform .13s ease;}
  .sns a:hover{transform:translateY(-2px);color:var(--hot);}

  /* 캐치프레이즈 스탬프 */
  .stamp{position:absolute;right:30px;top:352px;z-index:3;transform:rotate(-5deg);
    font-weight:900;font-size:.95rem;color:var(--hot);
    text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,3px 4px 6px rgba(214,59,125,.3);}

  /* 하단 대형 네임 */
  .bigname{position:absolute;right:26px;bottom:44px;z-index:3;text-align:right;transform:rotate(-2deg);}
  .bigname .en{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:4.6rem;line-height:.88;color:#fff;
    text-shadow:3.5px 0 0 var(--red),-3.5px 0 0 var(--red),0 3.5px 0 var(--red),0 -3.5px 0 var(--red),
      3.5px 3.5px 0 var(--red),-3.5px 3.5px 0 var(--red),3.5px -3.5px 0 var(--red),-3.5px -3.5px 0 var(--red),
      7px 8px 0 rgba(234,110,14,.35);}
  .bigname .kr{font-family:'A2z',sans-serif;font-weight:900;font-size:1.5rem;color:#fff;margin-top:7px;
    text-shadow:2.5px 0 0 var(--red),-2.5px 0 0 var(--red),0 2.5px 0 var(--red),0 -2.5px 0 var(--red),
      2.5px 2.5px 0 var(--red),-2.5px 2.5px 0 var(--red),2.5px -2.5px 0 var(--red),-2.5px -2.5px 0 var(--red),
      5px 6px 0 rgba(234,110,14,.3);}

  .credit{position:absolute;left:0;right:0;bottom:6px;z-index:3;text-align:center;
    font-weight:800;font-size:.6rem;color:var(--red-d);opacity:.9;}

  @media (prefers-reduced-motion:reduce){.app,.chip,.live,.sns a{transition:none;}}

  /* 인트로 로더 + 등장 */
  #page-loader{position:fixed;inset:0;z-index:9999;background:var(--paper);
    background-image:radial-gradient(rgba(255,92,158,.10) 17%,transparent 18%);background-size:23px 23px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:400px;gap:20px;
    animation:loaderOut .45s ease .6s forwards;}
  .pl-img{width:148px;height:148px;border-radius:50%;border:5px solid #fff;object-fit:cover;object-position:center 32%;
    box-shadow:0 8px 22px rgba(234,110,14,.22);animation:plPop 1s ease-in-out infinite;}
  .pl-dots{display:flex;gap:10px;}
  .pl-dots span{width:12px;height:12px;border-radius:50%;background:var(--hot);display:block;animation:plDot .85s ease-in-out infinite;}
  .pl-dots span:nth-child(2){animation-delay:.14s;}
  .pl-dots span:nth-child(3){animation-delay:.28s;}
  @keyframes plPop{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-12px) scale(1.05);}}
  @keyframes plDot{0%,100%{opacity:.35;transform:translateY(0);}50%{opacity:1;transform:translateY(-7px);}}
  @keyframes loaderOut{to{opacity:0;visibility:hidden;}}
  .stage{animation:stageReveal .6s cubic-bezier(.18,.72,.28,1) .55s both;}
  @keyframes stageReveal{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){#page-loader{display:none;}.stage{animation:none;}}
</style>
</head>
<body>
<div id="page-loader"><img class="pl-img" src="/loader.png" alt="히라"><div class="pl-dots"><span></span><span></span><span></span></div></div>
<div class="stage">
<main class="poster">

  <!-- 배경 사진 카드 : /bg.jpg 업로드 시 자동 교체 (없으면 그라데이션) -->
  <div class="card"></div>

  <!-- 아바타 : /avatar.png 업로드 시 자동 교체 (없으면 키비주얼) -->
  <div class="art"><img src="/avatar.png" onerror="this.onerror=null;this.src='/keyvisual.png';" alt="히라"></div>

  <!-- 좌상단 프로필 칩 -->
  <a class="chip" href="profile/">
    <img src="/loader.png" alt="">
    <span>
      <span class="nm">히라 <i>▸</i></span>
      <span class="sub">기미라다 · 8시에 온다</span>
    </span>
  </a>

  <!-- 우상단 버튼 : 일정 / 노래 / 업보 / 안내 -->
  <nav class="apps">
    <a class="app" href="schedule/" title="일정">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <b>일정</b>
    </a>
    <a class="app" href="https://meloming.com/channel/hira" target="_blank" rel="noopener" title="노래">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <b>노래</b>
    </a>
    <a class="app" href="upbo/" title="업보">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M8.5 12.5l2.5 2.5 4.5-4.5"/></svg>
      <b>업보</b>
    </a>
    <a class="app" href="guide/" title="안내">
      <svg viewBox="0 0 24 24"><path d="M3.5 11v3l4 1 8.5 4V6L7.5 10l-4 1z"/><path d="M18.5 9.5a4 4 0 0 1 0 5.5"/></svg>
      <b>안내</b>
    </a>
  </nav>

  <!-- 좌측 레일 -->
  <div class="onair">
    <div class="t">⏰ ON AIR</div>
    <div class="tm">저녁 8시</div>
    <span class="off">수 · 토 휴방</span>
  </div>
  <div class="tagset l1">
    <span class="k">Birthday</span>
    <span class="v">8월 23일</span>
  </div>
  <div class="tagset l2">
    <span class="k">Debut</span>
    <span class="v">2024. 03. 17</span>
  </div>

  <!-- 우측 레일 -->
  <div class="tagset r1">
    <span class="v">꾸이 💗</span>
  </div>
  <a class="live" href="https://www.sooplive.com/station/sjsr4611" target="_blank" rel="noopener">▶ 방송국</a>
  <div class="sns">
    <a href="https://cafe.naver.com/hirarara" target="_blank" rel="noopener">팬카페</a>
    <a href="https://www.youtube.com/@%EC%9A%B0%EC%A3%BC%EC%B1%84%EA%B0%95%ED%9E%88%EB%9D%BC" target="_blank" rel="noopener">유튜브</a>
  </div>
  <div class="stamp">쓰껄하러 와라 ♡</div>

  <!-- 대형 네임 -->
  <div class="bigname">
    <div class="en">HIRA</div>
    <div class="kr">히라 · ヒラ</div>
  </div>

  <div class="credit">© 2026 히라 · 꾸이단 💗</div>
</main>
</div>
<script>
  (function(){
    var stage=document.querySelector('.stage'), poster=document.querySelector('.poster');
    function fit(){ poster.style.transform='scale('+(stage.clientWidth/470)+')'; }
    fit(); window.addEventListener('resize',fit);
  })();
</script>
</body>
</html>
