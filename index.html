<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1000" />
<title>히라 · HIRA</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="히라 · HIRA">
<meta property="og:title" content="히라 · HIRA 프로필">
<meta property="og:description" content="기미라다. 8시에 온다. 쓰껄하러 와라 — 일정 · 노래 · 업보 · 안내">
<!-- 배포 도메인 확정 시: <meta property="og:image" content="https://도메인/avatar.png"> -->
<link rel="preload" href="/bg.jpg" as="image">
<link rel="preload" href="/avatar.png" as="image">
<link rel="stylesheet" href="/css/common.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet" />
<style>
  /* ===== 히어로 스테이지 : 470x607 캔버스 → 940x1214 (네브62+카드+푸터 = 1350) ===== */
  .stage{position:relative;width:min(940px,94vw);aspect-ratio:940/1214;margin:16px auto 0;}
  .poster{position:absolute;top:0;left:0;width:470px;height:607px;transform-origin:top left;
    overflow:hidden;border-radius:16px;background:#8fc0e8 url('/bg.jpg') center/cover no-repeat;
    box-shadow:0 10px 26px rgba(30,40,70,.22);isolation:isolate;}
  /* 하단 스크림 — 네임·패널 가독 */
  .poster::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(12,22,44,0) 46%,rgba(12,22,44,.46) 100%);}

  /* ===== 아바타 (z2) — /avatar.png 교체 슬롯 ===== */
  .art{position:absolute;left:0;right:0;top:8px;bottom:0;z-index:2;
    display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
  .art img{height:var(--avatar-h,96%);width:auto;max-width:none;
    transform:translateX(var(--avatar-x,52px));
    filter:drop-shadow(0 0 3px rgba(255,255,255,.75)) drop-shadow(0 10px 18px rgba(20,30,60,.32));}

  /* ===== 글라스 정보 패널 (z3) ===== */
  .glass{position:absolute;left:22px;bottom:22px;z-index:3;width:198px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(10px) saturate(1.15);
    border:1.5px solid rgba(255,255,255,.95);border-radius:18px;padding:15px 16px 16px;
    box-shadow:0 12px 28px rgba(25,35,65,.24);}
  .g-onair{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--ink);font-size:.98rem;}
  .g-onair .dot{width:9px;height:9px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 3px rgba(255,140,42,.25);animation:gPulse 1.6s ease-in-out infinite;}
  @keyframes gPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,140,42,.25);}50%{box-shadow:0 0 0 6px rgba(255,140,42,.12);}}
  .g-off{display:inline-block;margin-top:7px;background:#e8f3ff;color:#3d78b8;
    font-size:.66rem;font-weight:800;border-radius:10px;padding:2px 10px;}
  .glass hr{border:none;border-top:1.5px solid rgba(70,52,42,.12);margin:11px 0 10px;}
  .g-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;}
  .g-row .k{font-size:.62rem;font-weight:800;letter-spacing:.1em;color:#8a90a0;}
  .g-row .v{font-size:.83rem;font-weight:900;color:var(--ink);white-space:nowrap;}
  .g-live{display:block;margin-top:13px;text-align:center;text-decoration:none;
    background:linear-gradient(180deg,#ffa651,var(--red));color:#fff;font-weight:800;font-size:.9rem;
    border-radius:13px;padding:8px 0;box-shadow:0 5px 12px rgba(234,110,14,.42);
    transition:transform .14s ease,box-shadow .14s ease;}
  .g-live:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(234,110,14,.5);}
  .g-sns{display:flex;gap:7px;margin-top:8px;}
  .g-sns a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:.72rem;color:var(--ink);
    background:rgba(255,255,255,.72);border:1.5px solid rgba(70,52,42,.16);border-radius:11px;padding:5px 0;
    transition:background .12s ease;}
  .g-sns a:hover{background:#fff;}

  /* ===== 네임 (z3) ===== */
  .bigname{position:absolute;right:24px;bottom:20px;z-index:3;text-align:right;}
  .bigname .en{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:3.9rem;line-height:.9;color:#fff;
    letter-spacing:.01em;text-shadow:0 4px 18px rgba(15,25,50,.55),0 1px 3px rgba(15,25,50,.4);}
  .bigname .sub{margin-top:7px;font-weight:800;font-size:.78rem;color:rgba(255,255,255,.96);
    text-shadow:0 2px 8px rgba(15,25,50,.55);}
  .bigname .sub b{color:#ffc98f;}

  /* 슬림 푸터 */
  .foot{padding:10px 0 14px;}
  .foot .h{font-size:.95rem;}

  @media (prefers-reduced-motion:reduce){.g-onair .dot,.g-live,.g-sns a{animation:none;transition:none;}}

  /* 인트로 로더 (common보다 뒤 선언 = 우선) */
  #page-loader{position:fixed;inset:0;z-index:9999;background:var(--paper);
    background-image:radial-gradient(rgba(255,92,158,.10) 17%,transparent 18%);background-size:23px 23px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:400px;gap:20px;
    animation:loaderOut .45s ease .6s forwards;}
  .pl-img{width:148px;height:148px;border-radius:50%;border:5px solid #fff;object-fit:cover;object-position:center 32%;
    box-shadow:0 8px 22px rgba(234,110,14,.22);animation:plPop 1s ease-in-out infinite;}
  .pl-dots{display:flex;gap:10px;}
  .pl-dots span{width:12px;height:12px;border-radius:50%;background:var(--hot);display:block;animation:plDot .85s ease-in-out infinite;}
  .pl-dots span:nth-child(2){animation-delay:.14s;}
  .pl-dots span:nth-child(3){animation-delay:.28s;}
  @keyframes plPop{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-12px) scale(1.05);}}
  @keyframes plDot{0%,100%{opacity:.35;transform:translateY(0);}50%{opacity:1;transform:translateY(-7px);}}
  @keyframes loaderOut{to{opacity:0;visibility:hidden;}}
  .stage,.foot{animation:stageReveal .6s cubic-bezier(.18,.72,.28,1) .55s both;}
  @keyframes stageReveal{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){#page-loader{display:none;}.stage,.foot{animation:none;}}
</style>
</head>
<body>
<div id="page-loader"><img class="pl-img" src="/loader.png" alt="히라"><div class="pl-dots"><span></span><span></span><span></span></div></div>

<nav class="topnav"><div class="nav-inner">
  <a class="home" href="/">히라 ♡</a>
  <a class="lk" href="/profile/">프로필</a>
  <a class="lk" href="/schedule/">일정</a>
  <a class="lk" href="https://meloming.com/channel/hira" target="_blank" rel="noopener">노래책</a>
  <a class="lk" href="/upbo/">업보</a>
  <a class="lk" href="/guide/">방송안내</a>
</div></nav>

<div class="stage">
<main class="poster">
  <!-- 아바타 : /avatar.png 교체 (없으면 키비주얼) · 위치·크기 = --avatar-x / --avatar-h -->
  <div class="art"><img src="/avatar.png" onerror="this.onerror=null;this.src='/keyvisual.png';" alt="히라" fetchpriority="high"></div>

  <!-- 정보 패널 -->
  <aside class="glass">
    <div class="g-onair"><span class="dot"></span>ON AIR · 저녁 8시</div>
    <span class="g-off">수 · 토 휴방</span>
    <hr>
    <div class="g-row"><span class="k">BIRTHDAY</span><span class="v">8월 23일</span></div>
    <div class="g-row"><span class="k">DEBUT</span><span class="v">2024. 03. 17</span></div>
    <div class="g-row"><span class="k">FANDOM</span><span class="v">꾸이 💗</span></div>
    <a class="g-live" href="https://www.sooplive.com/station/sjsr4611" target="_blank" rel="noopener">▶ 방송국 바로가기</a>
    <div class="g-sns">
      <a href="https://cafe.naver.com/hirarara" target="_blank" rel="noopener">팬카페</a>
      <a href="https://www.youtube.com/@%EC%9A%B0%EC%A3%BC%EC%B1%84%EA%B0%95%ED%9E%88%EB%9D%BC" target="_blank" rel="noopener">유튜브</a>
    </div>
  </aside>

  <!-- 네임 -->
  <div class="bigname">
    <div class="en">HIRA</div>
    <div class="sub">히라 · <b>기미라다, 8시에 온다</b></div>
  </div>
</main>
</div>

<footer class="foot"><div class="h">© 2026 히라 · 꾸이단 💗</div></footer>

<script>
  (function(){
    var stage=document.querySelector('.stage'), poster=document.querySelector('.poster');
    function fit(){ poster.style.transform='scale('+(stage.clientWidth/470)+')'; }
    fit(); window.addEventListener('resize',fit);
  })();
</script>
</body>
</html>
